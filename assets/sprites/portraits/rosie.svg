<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="256" height="320">
  <rect width="256" height="320" fill="#0e0c10"/>
  <!-- Nightgown - she's been put to bed -->
  <rect x="30" y="240" width="196" height="100" fill="#c8c0d8" opacity="0.6" rx="8"/>
  <rect x="60" y="218" width="136" height="120" fill="#d0c8dc" opacity="0.5" rx="6"/>
  <!-- Neck -->
  <rect x="114" y="196" width="28" height="30" fill="#e0c8b0"/>
  <!-- Head - small, round, child -->
  <ellipse cx="128" cy="158" rx="66" ry="70" fill="#e0c8b0"/>
  <!-- Hair - pigtails / plaits, dark like Edmund's -->
  <ellipse cx="128" cy="96" rx="64" ry="36" fill="#201c28"/>
  <rect x="64" y="96" width="18" height="62" fill="#201c28" rx="4"/>
  <rect x="174" y="96" width="18" height="62" fill="#201c28" rx="4"/>
  <!-- Plaits -->
  <rect x="58" y="145" width="16" height="80" fill="#201c28" rx="8"/>
  <rect x="182" y="145" width="16" height="80" fill="#201c28" rx="8"/>
  <!-- Hair ribbons -->
  <rect x="52" y="142" width="28" height="12" fill="#8a3040" rx="4"/>
  <rect x="176" y="142" width="28" height="12" fill="#8a3040" rx="4"/>
  <!-- Eyes - big, innocent, confused -->
  <ellipse cx="100" cy="160" rx="18" ry="16" fill="#f4ece4"/>
  <ellipse cx="156" cy="160" rx="18" ry="16" fill="#f4ece4"/>
  <ellipse cx="100" cy="162" rx="12" ry="12" fill="#6a4838"/>
  <ellipse cx="156" cy="162" rx="12" ry="12" fill="#6a4838"/>
  <ellipse cx="100" cy="163" rx="7" ry="7" fill="#0e0808"/>
  <ellipse cx="156" cy="163" rx="7" ry="7" fill="#0e0808"/>
  <!-- Catchlights - bigger in children -->
  <ellipse cx="97" cy="160" rx="3" ry="3" fill="#f0e8e0" opacity="0.7"/>
  <ellipse cx="153" cy="160" rx="3" ry="3" fill="#f0e8e0" opacity="0.7"/>
  <!-- Lashes -->
  <path d="M82 148 Q100 143 118 148" stroke="#201c28" stroke-width="2" fill="none"/>
  <path d="M138 148 Q156 143 174 148" stroke="#201c28" stroke-width="2" fill="none"/>
  <!-- Chubby cheeks -->
  <ellipse cx="78" cy="176" rx="18" ry="14" fill="#e8a888" opacity="0.35"/>
  <ellipse cx="178" cy="176" rx="18" ry="14" fill="#e8a888" opacity="0.35"/>
  <!-- Nose - tiny button -->
  <circle cx="122" cy="180" r="3" fill="#c8a090" opacity="0.5"/>
  <circle cx="134" cy="180" r="3" fill="#c8a090" opacity="0.5"/>
  <!-- Mouth - slightly open, confused -->
  <path d="M110 198 Q128 204 146 198" stroke="#c09080" stroke-width="2" fill="none"/>
  <ellipse cx="128" cy="199" rx="14" ry="5" fill="#e0a898" opacity="0.3"/>
</svg>
