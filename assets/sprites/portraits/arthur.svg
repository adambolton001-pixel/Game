<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="256" height="320">
  <rect width="256" height="320" fill="#0c0a0e"/>
  <!-- Shoulders - well-tailored coat, prosperous -->
  <rect x="10" y="210" width="236" height="130" fill="#141018" rx="8"/>
  <rect x="30" y="190" width="196" height="150" fill="#1a1520" rx="6"/>
  <!-- Cravat - neat, respectable -->
  <rect x="96" y="186" width="64" height="44" fill="#d8d0c0" rx="4"/>
  <polygon points="128,226 103,190 153,190" fill="#b8a890"/>
  <!-- Waistcoat visible -->
  <rect x="90" y="220" width="76" height="80" fill="#221c18" rx="2"/>
  <rect x="120" y="225" width="16" height="70" fill="#1a1610"/>
  <!-- Neck -->
  <rect x="110" y="170" width="36" height="28" fill="#c0a080"/>
  <!-- Head - distinguished, heavier jowl, 50s -->
  <ellipse cx="128" cy="140" rx="72" ry="82" fill="#c0a080"/>
  <!-- Hair - silver-grey, well-groomed, receding -->
  <ellipse cx="128" cy="76" rx="64" ry="36" fill="#484448"/>
  <rect x="64" y="76" width="20" height="50" fill="#484448" rx="3"/>
  <rect x="172" y="76" width="20" height="50" fill="#484448" rx="3"/>
  <!-- Silver temples -->
  <rect x="60" y="110" width="20" height="30" fill="#888090" rx="4"/>
  <rect x="176" y="110" width="20" height="30" fill="#888090" rx="4"/>
  <!-- Balding top -->
  <ellipse cx="128" cy="78" rx="50" ry="28" fill="#b8987c" opacity="0.3"/>
  <!-- Eyes - calm, composed, slightly calculating -->
  <ellipse cx="98" cy="146" rx="17" ry="13" fill="#ece4d8"/>
  <ellipse cx="158" cy="146" rx="17" ry="13" fill="#ece4d8"/>
  <ellipse cx="98" cy="148" rx="11" ry="10" fill="#4a5848"/>
  <ellipse cx="158" cy="148" rx="11" ry="10" fill="#4a5848"/>
  <ellipse cx="98" cy="149" rx="6" ry="6" fill="#0e1008"/>
  <ellipse cx="158" cy="149" rx="6" ry="6" fill="#0e1008"/>
  <ellipse cx="96" cy="147" rx="2" ry="2" fill="#dcd4c8" opacity="0.5"/>
  <ellipse cx="156" cy="147" rx="2" ry="2" fill="#dcd4c8" opacity="0.5"/>
  <!-- Eyebrows - distinguished, thick, greying -->
  <path d="M80 132 Q98 127 116 133" stroke="#484448" stroke-width="4" fill="none"/>
  <path d="M140 133 Q158 127 176 132" stroke="#484448" stroke-width="4" fill="none"/>
  <!-- Nose - aquiline -->
  <path d="M128 160 L122 176 Q128 178 134 176 L128 160" fill="#b09070" opacity="0.5"/>
  <!-- Mouth - a subtle, controlled smile. Hiding something. -->
  <path d="M107 196 Q128 205 149 196" stroke="#90705c" stroke-width="2" fill="none"/>
  <path d="M112 197 Q128 203 144 197" stroke="#c0a080" stroke-width="1.5" fill="none"/>
  <!-- Jowls -->
  <ellipse cx="80" cy="180" rx="22" ry="18" fill="#b89878" opacity="0.3"/>
  <ellipse cx="176" cy="180" rx="22" ry="18" fill="#b89878" opacity="0.3"/>
  <!-- Moustache - trimmed, neat -->
  <ellipse cx="128" cy="190" rx="26" ry="8" fill="#484448"/>
  <ellipse cx="116" cy="189" rx="12" ry="6" fill="#3c3840"/>
  <ellipse cx="140" cy="189" rx="12" ry="6" fill="#3c3840"/>
</svg>
