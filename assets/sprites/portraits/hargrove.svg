<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="256" height="320">
  <rect width="256" height="320" fill="#0a0c0a"/>
  <!-- Expensive suit - power dressing -->
  <rect x="8" y="205" width="240" height="135" fill="#0c140c" rx="6"/>
  <rect x="28" y="182" width="200" height="158" fill="#101810" rx="5"/>
  <!-- White shirt, fancy cravat -->
  <rect x="94" y="176" width="68" height="44" fill="#e0dcd0" rx="3"/>
  <polygon points="128,218 98,180 158,180" fill="#c0b898"/>
  <!-- Gold watch chain visible -->
  <path d="M80 235 Q128 225 176 235" stroke="#a08830" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Neck - thick, bull-necked -->
  <rect x="104" y="163" width="48" height="28" fill="#c0a070"/>
  <!-- Head - florid, well-fed, 55+ -->
  <ellipse cx="128" cy="132" rx="76" ry="84" fill="#c0a070"/>
  <!-- Hair - thinning, silver, swept back, oiled -->
  <ellipse cx="128" cy="60" rx="72" ry="28" fill="#686068"/>
  <rect x="56" y="60" width="24" height="50" fill="#686068" rx="2"/>
  <rect x="176" y="60" width="24" height="46" fill="#686068" rx="2"/>
  <!-- Oiled shine -->
  <ellipse cx="128" cy="62" rx="55" ry="18" fill="#888090" opacity="0.4"/>
  <!-- Eyes - entitled, cold -->
  <ellipse cx="96" cy="138" rx="17" ry="14" fill="#e4d8c0"/>
  <ellipse cx="160" cy="138" rx="17" ry="14" fill="#e4d8c0"/>
  <ellipse cx="96" cy="140" rx="11" ry="10" fill="#405840"/>
  <ellipse cx="160" cy="140" rx="11" ry="10" fill="#405840"/>
  <ellipse cx="96" cy="141" rx="6" ry="6" fill="#080c08"/>
  <ellipse cx="160" cy="141" rx="6" ry="6" fill="#080c08"/>
  <!-- Heavy brow - dominant -->
  <rect x="77" y="122" width="40" height="7" fill="#686068" rx="2"/>
  <rect x="139" y="122" width="40" height="7" fill="#686068" rx="2"/>
  <!-- Jowls - very pronounced -->
  <ellipse cx="66" cy="170" rx="28" ry="22" fill="#b89060" opacity="0.4"/>
  <ellipse cx="190" cy="170" rx="28" ry="22" fill="#b89060" opacity="0.4"/>
  <!-- Florid complexion - red nose, cheeks -->
  <ellipse cx="96" cy="160" rx="22" ry="16" fill="#c06040" opacity="0.2"/>
  <ellipse cx="160" cy="160" rx="22" ry="16" fill="#c06040" opacity="0.2"/>
  <!-- Nose - bulbous -->
  <ellipse cx="128" cy="162" rx="16" ry="14" fill="#a87050" opacity="0.5"/>
  <ellipse cx="128" cy="164" rx="20" ry="16" fill="#b88060" opacity="0.2"/>
  <!-- Mouth - thin, contemptuous -->
  <path d="M104 188 Q128 182 152 188" stroke="#806040" stroke-width="3" fill="none"/>
  <!-- Chin - strong, double chin forming -->
  <ellipse cx="128" cy="208" rx="38" ry="18" fill="#b89060" opacity="0.4"/>
  <!-- Whiskers -->
  <path d="M90 178 Q108 174 122 180 Q128 176 134 180 Q148 174 166 178" stroke="#686068" stroke-width="3.5" fill="none"/>
</svg>
