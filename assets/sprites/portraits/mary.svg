<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="256" height="320">
  <rect width="256" height="320" fill="#0c0b0a"/>
  <!-- Worn dress, shawl -->
  <rect x="12" y="220" width="232" height="120" fill="#1a1610" rx="5"/>
  <rect x="30" y="198" width="196" height="142" fill="#1e1a12" rx="4"/>
  <!-- Shawl draped over shoulders -->
  <path d="M30 200 Q60 240 30 320" fill="#281e14" opacity="0.7"/>
  <path d="M226 200 Q196 240 226 320" fill="#281e14" opacity="0.7"/>
  <!-- Neck -->
  <rect x="110" y="180" width="36" height="28" fill="#b89070"/>
  <!-- Head - tired, guarded, 30s but looks older -->
  <ellipse cx="128" cy="148" rx="66" ry="76" fill="#b89070"/>
  <!-- Hair - dark, tied back severely -->
  <ellipse cx="128" cy="82" rx="64" ry="30" fill="#1c1410"/>
  <rect x="64" y="82" width="18" height="58" fill="#1c1410" rx="3"/>
  <rect x="174" y="82" width="18" height="55" fill="#1c1410" rx="3"/>
  <!-- Severe centre parting -->
  <rect x="124" y="76" width="8" height="44" fill="#b89070" opacity="0.3"/>
  <!-- Tired eyes - watchful, measuring Edmund -->
  <ellipse cx="100" cy="152" rx="15" ry="12" fill="#e4d8c4"/>
  <ellipse cx="156" cy="152" rx="15" ry="12" fill="#e4d8c4"/>
  <ellipse cx="100" cy="154" rx="9" ry="9" fill="#504030"/>
  <ellipse cx="156" cy="154" rx="9" ry="9" fill="#504030"/>
  <ellipse cx="100" cy="155" rx="5" ry="5" fill="#0c0804"/>
  <ellipse cx="156" cy="155" rx="5" ry="5" fill="#0c0804"/>
  <!-- Deep shadows under eyes - exhaustion -->
  <ellipse cx="100" cy="162" rx="15" ry="6" fill="#806040" opacity="0.5"/>
  <ellipse cx="156" cy="162" rx="15" ry="6" fill="#806040" opacity="0.5"/>
  <!-- Eyebrows - thin, wary -->
  <path d="M84 138 Q100 135 116 140" stroke="#1c1410" stroke-width="2.5" fill="none"/>
  <path d="M140 140 Q156 135 172 138" stroke="#1c1410" stroke-width="2.5" fill="none"/>
  <!-- Nose - straight, thin -->
  <path d="M128 162 L122 174 L128 177 L134 174 L128 162" fill="#a88060" opacity="0.4"/>
  <!-- Mouth - pressed, not smiling, not hostile, just guarded -->
  <path d="M108 192 Q128 192 148 192" stroke="#906040" stroke-width="2.5" fill="none"/>
  <!-- Lines of worry at mouth corners -->
  <path d="M108 192 Q104 198 106 204" stroke="#906040" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M148 192 Q152 198 150 204" stroke="#906040" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Head covering hint - a dark scarf, suggested -->
  <rect x="62" y="76" width="132" height="18" fill="#181410" opacity="0.6" rx="2"/>
</svg>
