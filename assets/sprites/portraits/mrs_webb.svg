<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 320" width="256" height="320">
  <rect width="256" height="320" fill="#0e0c0d"/>
  <!-- Dark dress, mourning clothes sympathetically worn -->
  <rect x="8" y="215" width="240" height="125" fill="#14101a" rx="6"/>
  <rect x="25" y="196" width="206" height="144" fill="#1a1520" rx="5"/>
  <!-- Brooch at collar -->
  <ellipse cx="128" cy="200" rx="10" ry="8" fill="#483840"/>
  <ellipse cx="128" cy="200" rx="6" ry="5" fill="#302030"/>
  <!-- Neck - soft -->
  <rect x="106" y="179" width="44" height="28" fill="#c8a888"/>
  <!-- Head - warm, motherly face, 40s -->
  <ellipse cx="128" cy="148" rx="70" ry="76" fill="#c8a888"/>
  <!-- Hair - greying, pinned up neatly -->
  <ellipse cx="128" cy="80" rx="68" ry="34" fill="#484050"/>
  <rect x="60" y="80" width="22" height="55" fill="#484050" rx="3"/>
  <rect x="174" y="80" width="22" height="55" fill="#484050" rx="3"/>
  <!-- Hair bun at back/top -->
  <ellipse cx="128" cy="74" rx="46" ry="24" fill="#524860"/>
  <!-- Grey streaks -->
  <rect x="88" y="80" width="8" height="40" fill="#888090" opacity="0.5"/>
  <rect x="160" y="80" width="8" height="38" fill="#888090" opacity="0.5"/>
  <!-- Eyes - kind, worried, slightly red from crying -->
  <ellipse cx="98" cy="154" rx="17" ry="14" fill="#f0e8e0"/>
  <ellipse cx="158" cy="154" rx="17" ry="14" fill="#f0e8e0"/>
  <ellipse cx="98" cy="156" rx="11" ry="10" fill="#604848"/>
  <ellipse cx="158" cy="156" rx="11" ry="10" fill="#604848"/>
  <ellipse cx="98" cy="157" rx="6" ry="6" fill="#100808"/>
  <ellipse cx="158" cy="157" rx="6" ry="6" fill="#100808"/>
  <!-- Red around eyes - she's been crying -->
  <ellipse cx="98" cy="162" rx="16" ry="6" fill="#c06060" opacity="0.15"/>
  <ellipse cx="158" cy="162" rx="16" ry="6" fill="#c06060" opacity="0.15"/>
  <!-- Eyebrows - arched gently, concerned -->
  <path d="M80 138 Q98 133 116 140" stroke="#484050" stroke-width="3" fill="none"/>
  <path d="M140 140 Q158 133 176 138" stroke="#484050" stroke-width="3" fill="none"/>
  <!-- Crow's feet - kind wrinkles -->
  <path d="M82 156 Q70 160 68 168" stroke="#a88868" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M174 156 Q186 160 188 168" stroke="#a88868" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Nose - rounded, soft -->
  <ellipse cx="128" cy="172" rx="10" ry="10" fill="#b89878" opacity="0.3"/>
  <!-- Mouth - soft, sympathetic smile -->
  <path d="M106 194 Q128 202 150 194" stroke="#a07860" stroke-width="2" fill="none"/>
  <path d="M112 195 Q128 200 144 195" stroke="#c8a888" stroke-width="1.5" fill="none"/>
  <!-- Cheeks - rosy -->
  <ellipse cx="78" cy="174" rx="20" ry="14" fill="#c08080" opacity="0.2"/>
  <ellipse cx="178" cy="174" rx="20" ry="14" fill="#c08080" opacity="0.2"/>
</svg>
