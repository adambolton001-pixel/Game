<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" fill="#0a0810" rx="16"/>
  <!-- Lantern body -->
  <rect x="44" y="42" width="40" height="54" fill="#1a1428" rx="4"/>
  <rect x="48" y="46" width="32" height="46" fill="#0e0c14" rx="3"/>
  <!-- Lantern top -->
  <rect x="40" y="36" width="48" height="10" fill="#221c30" rx="3"/>
  <rect x="52" y="26" width="24" height="14" fill="#1a1428" rx="3"/>
  <!-- Handle -->
  <path d="M60 26 Q64 16 68 26" stroke="#2a2038" stroke-width="3" fill="none"/>
  <!-- Flame inside -->
  <ellipse cx="64" cy="62" rx="10" ry="14" fill="#c85a10" opacity="0.9"/>
  <ellipse cx="64" cy="60" rx="7" ry="10" fill="#e87820" opacity="0.85"/>
  <ellipse cx="64" cy="58" rx="5" ry="7" fill="#f0a830" opacity="0.8"/>
  <ellipse cx="64" cy="57" rx="3" ry="5" fill="#f8e060" opacity="0.75"/>
  <!-- Glow -->
  <ellipse cx="64" cy="69" rx="18" ry="22" fill="#c06010" opacity="0.12"/>
  <!-- Lantern base -->
  <rect x="40" y="92" width="48" height="8" fill="#221c30" rx="2"/>
  <!-- Lantern glass panels (lines) -->
  <line x1="64" y1="46" x2="64" y2="92" stroke="#2a2038" stroke-width="1.5"/>
  <line x1="48" y1="69" x2="80" y2="69" stroke="#2a2038" stroke-width="1"/>
  <!-- Fog wisps -->
  <ellipse cx="25" cy="80" rx="14" ry="6" fill="#14121e" opacity="0.5"/>
  <ellipse cx="103" cy="60" rx="12" ry="5" fill="#14121e" opacity="0.4"/>
</svg>
