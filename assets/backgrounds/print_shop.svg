<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="lampGlow1" cx="25%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#b87820" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a0805" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow2" cx="75%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#b87820" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0805" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1208"/>
      <stop offset="100%" stop-color="#0d0904"/>
    </linearGradient>
  </defs>

  <!-- Background wall - dark, ink-stained -->
  <rect width="1920" height="1080" fill="#0e0c08"/>
  <rect width="1920" height="900" fill="#141008"/>

  <!-- Ceiling beams -->
  <rect y="0" width="1920" height="80" fill="#0a0806"/>
  <rect x="200" y="0" width="60" height="820" fill="#0d0b07"/>
  <rect x="900" y="0" width="60" height="820" fill="#0d0b07"/>
  <rect x="1600" y="0" width="60" height="820" fill="#0d0b07"/>

  <!-- Gas lamps hanging from ceiling -->
  <!-- Left lamp -->
  <rect x="476" y="0" width="8" height="100" fill="#1a1608"/>
  <rect x="465" y="95" width="30" height="20" fill="#251e0a" rx="3"/>
  <ellipse cx="480" cy="108" rx="12" ry="12" fill="#c89020" opacity="0.9"/>
  <circle cx="480" cy="108" r="30" fill="#b07010" opacity="0.15"/>
  <!-- Right lamp -->
  <rect x="1436" y="0" width="8" height="100" fill="#1a1608"/>
  <rect x="1425" y="95" width="30" height="20" fill="#251e0a" rx="3"/>
  <ellipse cx="1440" cy="108" rx="12" ry="12" fill="#c89020" opacity="0.9"/>
  <circle cx="1440" cy="108" r="30" fill="#b07010" opacity="0.15"/>

  <!-- The printing press - centre-left, massive and iron -->
  <rect x="300" y="320" width="500" height="500" fill="#181410"/>
  <rect x="320" y="340" width="460" height="460" fill="#201a12"/>
  <!-- Press bed -->
  <rect x="330" y="500" width="440" height="80" fill="#141008"/>
  <rect x="330" y="580" width="440" height="200" fill="#1a1410"/>
  <!-- Press screw mechanism -->
  <rect x="520" y="320" width="20" height="180" fill="#101008"/>
  <ellipse cx="530" cy="320" rx="60" ry="18" fill="#181412"/>
  <!-- Press handle -->
  <rect x="460" y="310" width="140" height="14" fill="#201c10" rx="4"/>
  <circle cx="460" cy="317" r="12" fill="#161210"/>
  <circle cx="600" cy="317" r="12" fill="#161210"/>
  <!-- Paper rollers -->
  <rect x="330" y="490" width="440" height="20" fill="#101008" rx="10"/>
  <rect x="330" y="570" width="440" height="20" fill="#101008" rx="10"/>
  <!-- Type cases on side -->
  <rect x="200" y="400" width="110" height="400" fill="#181410"/>
  <g fill="#101008" stroke="#201810" stroke-width="0.5">
    <rect x="210" y="410" width="90" height="12"/> <rect x="210" y="425" width="90" height="12"/> <rect x="210" y="440" width="90" height="12"/>
    <rect x="210" y="455" width="90" height="12"/> <rect x="210" y="470" width="90" height="12"/> <rect x="210" y="485" width="90" height="12"/>
    <rect x="210" y="500" width="90" height="12"/> <rect x="210" y="515" width="90" height="12"/> <rect x="210" y="530" width="90" height="12"/>
    <rect x="210" y="545" width="90" height="12"/> <rect x="210" y="560" width="90" height="12"/> <rect x="210" y="575" width="90" height="12"/>
    <rect x="210" y="590" width="90" height="12"/> <rect x="210" y="605" width="90" height="12"/> <rect x="210" y="620" width="90" height="12"/>
    <rect x="210" y="635" width="90" height="12"/> <rect x="210" y="650" width="90" height="12"/> <rect x="210" y="665" width="90" height="12"/>
    <rect x="210" y="680" width="90" height="12"/> <rect x="210" y="695" width="90" height="12"/> <rect x="210" y="710" width="90" height="12"/>
    <rect x="210" y="725" width="90" height="12"/> <rect x="210" y="740" width="90" height="12"/> <rect x="210" y="755" width="90" height="12"/>
  </g>

  <!-- Ink-stained work desk - right side -->
  <rect x="1000" y="560" width="600" height="260" fill="#1e1810"/>
  <rect x="1000" y="550" width="600" height="20" fill="#2a2014"/>
  <rect x="1010" y="565" width="8" height="250" fill="#181408"/>
  <rect x="1582" y="565" width="8" height="250" fill="#181408"/>
  <!-- Papers on desk -->
  <rect x="1020" y="560" width="160" height="200" fill="#e8e0cc" opacity="0.7" transform="rotate(-3 1020 560)"/>
  <rect x="1200" y="560" width="160" height="200" fill="#e0d8c4" opacity="0.6" transform="rotate(2 1200 560)"/>
  <rect x="1380" y="560" width="120" height="160" fill="#ddd5c0" opacity="0.65" transform="rotate(-1 1380 560)"/>
  <!-- Ink bottles -->
  <rect x="1480" y="520" width="22" height="40" fill="#0a0808" rx="3"/>
  <rect x="1515" y="515" width="20" height="45" fill="#080a08" rx="3"/>
  <rect x="1550" y="520" width="24" height="38" fill="#0a0a08" rx="3"/>
  <!-- Quill -->
  <rect x="1440" y="510" width="3" height="55" fill="#c8c090" transform="rotate(-15 1440 510)"/>

  <!-- Stacked paper bales -->
  <rect x="1700" y="500" width="180" height="320" fill="#d8d0bc"/>
  <rect x="1700" y="500" width="180" height="10" fill="#c8c0ac"/>
  <rect x="1700" y="550" width="180" height="10" fill="#c0b8a4"/>
  <rect x="1700" y="600" width="180" height="10" fill="#c8c0ac"/>
  <rect x="1700" y="650" width="180" height="10" fill="#c0b8a4"/>
  <rect x="1700" y="700" width="180" height="10" fill="#c8c0ac"/>
  <rect x="1700" y="750" width="180" height="10" fill="#c0b8a4"/>

  <!-- Floor -->
  <rect y="820" width="1920" height="260" fill="url(#floorGrad)"/>
  <g stroke="#120e06" stroke-width="1.5" fill="none" opacity="0.4">
    <line x1="0" y1="850" x2="1920" y2="850"/>
    <line x1="0" y1="885" x2="1920" y2="885"/>
    <line x1="0" y1="920" x2="1920" y2="920"/>
    <line x1="0" y1="960" x2="1920" y2="960"/>
    <line x1="0" y1="1005" x2="1920" y2="1005"/>
    <line x1="0" y1="1050" x2="1920" y2="1050"/>
    <line x1="500" y1="820" x2="490" y2="1080"/>
    <line x1="900" y1="820" x2="900" y2="1080"/>
    <line x1="1300" y1="820" x2="1310" y2="1080"/>
    <line x1="1700" y1="820" x2="1720" y2="1080"/>
  </g>
  <!-- Floor skirting -->
  <rect y="814" width="1920" height="10" fill="#241c0c"/>

  <!-- Ink stains on floor -->
  <ellipse cx="420" cy="840" rx="40" ry="15" fill="#050402" opacity="0.8"/>
  <ellipse cx="550" cy="870" rx="25" ry="10" fill="#050402" opacity="0.6"/>
  <ellipse cx="1150" cy="855" rx="35" ry="12" fill="#050402" opacity="0.5"/>

  <!-- Lamp glow overlays -->
  <rect width="1920" height="1080" fill="url(#lampGlow1)"/>
  <rect width="1920" height="1080" fill="url(#lampGlow2)"/>

  <!-- Dark corners -->
  <rect width="200" height="1080" fill="#05040200" opacity="0.7"/>
  <linearGradient id="leftDark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#050402" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#050402" stop-opacity="0"/>
  </linearGradient>
  <rect width="200" height="1080" fill="url(#leftDark)"/>
  <linearGradient id="rightDark" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#050402" stop-opacity="0"/>
    <stop offset="100%" stop-color="#050402" stop-opacity="0.8"/>
  </linearGradient>
  <rect x="1720" width="200" height="1080" fill="url(#rightDark)"/>

  <!-- Foreground shadow -->
  <rect y="1000" width="1920" height="80" fill="#030201" opacity="0.9"/>
</svg>
