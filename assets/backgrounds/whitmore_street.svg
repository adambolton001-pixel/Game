  <g fill="none" stroke="#181514" stroke-width="1" opacity="0.5">
    <line x1="0" y1="700" x2="1920" y2="700"/> <line x1="0" y1="730" x2="1920" y2="730"/> <line x1="0" y1="760" x2="1920" y2="760"/>
    <line x1="0" y1="800" x2="1920" y2="800"/> <line x1="0" y1="850" x2="1920" y2="850"/> <line x1="0" y1="910" x2="1920" y2="910"/> <line x1="0" y1="980" x2="1920" y2="980"/>
    <line x1="200" y1="680" x2="180" y2="1080"/> <line x1="500" y1="680" x2="490" y2="1080"/> <line x1="800" y1="680" x2="800" y2="1080"/>
    <line x1="1100" y1="680" x2="1110" y2="1080"/> <line x1="1400" y1="680" x2="1420" y2="1080"/> <line x1="1700" y1="680" x2="1730" y2="1080"/>
  </g>

  <!-- Gas lamp -->
  <rect x="954" y="260" width="12" height="420" fill="#201a20"/>
  <rect x="946" y="672" width="28" height="14" fill="#181418"/>
  <rect x="942" y="242" width="36" height="28" fill="#2a222a" rx="3"/>
  <ellipse cx="960" cy="256" rx="14" ry="14" fill="#b07818" opacity="0.85"/>
  <circle cx="960" cy="256" r="50" fill="#a07010" opacity="0.1"/>
  <circle cx="960" cy="256" r="25" fill="#c09020" opacity="0.15"/>

  <!-- Puddles on cobblestones -->
  <ellipse cx="400" cy="730" rx="80" ry="20" fill="#0e0e18" opacity="0.6"/>
  <ellipse cx="1200" cy="760" rx="65" ry="16" fill="#0e0e18" opacity="0.5"/>
  <ellipse cx="800" cy="800" rx="50" ry="14" fill="#0e0e18" opacity="0.55"/>

  <!-- Rubbish / debris in corners -->
  <rect x="30" y="700" width="80" height="40" fill="#141010" rx="3"/>
  <rect x="1810" y="710" width="80" height="35" fill="#141010" rx="3"/>

  <!-- Fog -->
  <rect width="1920" height="1080" fill="url(#fogMid)"/>

  <!-- Door in left building -->
  <rect x="160" y="590" width="80" height="120" fill="#0f0a0c" rx="2"/>
  <rect x="158" y="588" width="84" height="124" fill="none" stroke="#2a2028" stroke-width="4" rx="2"/>

  <!-- Foreground shadow -->
  <rect y="1000" width="1920" height="80" fill="#050408" opacity="0.9"/>
</svg>
