    <rect x="0" y="246" width="45" height="16"/>  <rect x="55" y="246" width="60" height="16"/>  <rect x="125" y="246" width="60" height="16"/> <rect x="195" y="246" width="60" height="16"/> <rect x="265" y="246" width="60" height="16"/> <rect x="335" y="246" width="60" height="16"/> <rect x="405" y="246" width="60" height="16"/>
    <rect x="10" y="272" width="60" height="16"/> <rect x="80" y="272" width="60" height="16"/> <rect x="150" y="272" width="60" height="16"/> <rect x="220" y="272" width="60" height="16"/> <rect x="290" y="272" width="60" height="16"/> <rect x="360" y="272" width="60" height="16"/> <rect x="430" y="272" width="50" height="16"/>
    <rect x="0" y="298" width="45" height="16"/>  <rect x="55" y="298" width="60" height="16"/>  <rect x="125" y="298" width="60" height="16"/> <rect x="195" y="298" width="60" height="16"/> <rect x="265" y="298" width="60" height="16"/> <rect x="335" y="298" width="60" height="16"/> <rect x="405" y="298" width="60" height="16"/>
    <rect x="10" y="324" width="60" height="16"/> <rect x="80" y="324" width="60" height="16"/> <rect x="150" y="324" width="60" height="16"/> <rect x="220" y="324" width="60" height="16"/> <rect x="290" y="324" width="60" height="16"/> <rect x="360" y="324" width="60" height="16"/> <rect x="430" y="324" width="50" height="16"/>
  </g>
  <!-- Windows left building -->
  <rect x="40" y="260" width="80" height="110" fill="#0a0810" rx="2"/>
  <rect x="160" y="260" width="80" height="110" fill="#0a0810" rx="2"/>
  <rect x="280" y="260" width="80" height="110" fill="#0a0810" rx="2"/>
  <rect x="380" y="260" width="80" height="110" fill="#60400a" opacity="0.5" rx="2"/>
  <rect x="40" y="420" width="80" height="110" fill="#0a0810" rx="2"/>
  <rect x="160" y="420" width="80" height="110" fill="#0a0810" rx="2"/>
  <rect x="280" y="420" width="80" height="110" fill="#0a0810" rx="2"/>
  <rect x="380" y="420" width="80" height="110" fill="#0a0810" rx="2"/>
