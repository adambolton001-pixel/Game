    <rect x="1440" y="246" width="45" height="16"/> <rect x="1495" y="246" width="60" height="16"/> <rect x="1565" y="246" width="60" height="16"/> <rect x="1635" y="246" width="60" height="16"/> <rect x="1705" y="246" width="60" height="16"/> <rect x="1775" y="246" width="60" height="16"/> <rect x="1845" y="246" width="60" height="16"/>
    <rect x="1450" y="272" width="60" height="16"/> <rect x="1520" y="272" width="60" height="16"/> <rect x="1590" y="272" width="60" height="16"/> <rect x="1660" y="272" width="60" height="16"/> <rect x="1730" y="272" width="60" height="16"/> <rect x="1800" y="272" width="60" height="16"/> <rect x="1870" y="272" width="50" height="16"/>
    <rect x="1440" y="298" width="45" height="16"/> <rect x="1495" y="298" width="60" height="16"/> <rect x="1565" y="298" width="60" height="16"/> <rect x="1635" y="298" width="60" height="16"/> <rect x="1705" y="298" width="60" height="16"/> <rect x="1775" y="298" width="60" height="16"/> <rect x="1845" y="298" width="60" height="16"/>
  </g>
  <rect x="1480" y="260" width="80" height="110" fill="#0a0810" rx="2"/>
  <rect x="1600" y="260" width="80" height="110" fill="#584008" opacity="0.45" rx="2"/>
  <rect x="1720" y="260" width="80" height="110" fill="#0a0810" rx="2"/>
  <rect x="1820" y="260" width="80" height="110" fill="#0a0810" rx="2"/>
  <rect x="1480" y="420" width="80" height="110" fill="#0a0810" rx="2"/>
  <rect x="1600" y="420" width="80" height="110" fill="#0a0810" rx="2"/>
  <rect x="1720" y="420" width="80" height="110" fill="#0a0810" rx="2"/>
  <g fill="none" stroke="#241e22" stroke-width="3">
    <rect x="1480" y="260" width="80" height="110" rx="2"/> <rect x="1600" y="260" width="80" height="110" rx="2"/> <rect x="1720" y="260" width="80" height="110" rx="2"/> <rect x="1820" y="260" width="80" height="110" rx="2"/>
    <rect x="1480" y="420" width="80" height="110" rx="2"/> <rect x="1600" y="420" width="80" height="110" rx="2"/> <rect x="1720" y="420" width="80" height="110" rx="2"/>
  </g>

  <!-- Street cobblestones -->
