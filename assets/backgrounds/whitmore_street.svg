    <rect x="40" y="420" width="80" height="110" rx="2"/> <rect x="160" y="420" width="80" height="110" rx="2"/> <rect x="280" y="420" width="80" height="110" rx="2"/> <rect x="380" y="420" width="80" height="110" rx="2"/>
  </g>

