<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d18"/>
      <stop offset="100%" stop-color="#181525"/>
    </linearGradient>
    <radialGradient id="fogMid" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#1a1828" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0d0c18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
  </defs>

  <!-- Sky - heavy fog, overcast -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- Far background tenements -->
  <rect x="0" y="100" width="500" height="700" fill="#141018"/>
  <rect x="480" y="180" width="400" height="620" fill="#100e14"/>
  <rect x="860" y="80" width="320" height="720" fill="#141018"/>
  <rect x="1160" y="140" width="420" height="660" fill="#100e14"/>
  <rect x="1560" y="100" width="360" height="700" fill="#141018"/>

  <!-- Windows on far buildings - most dark, a few dimly lit -->
  <g fill="#0a0810">
    <rect x="40" y="160" width="60" height="80" rx="2"/> <rect x="120" y="160" width="60" height="80" rx="2"/> <rect x="200" y="160" width="60" height="80" rx="2"/>
    <rect x="40" y="280" width="60" height="80" rx="2"/> <rect x="120" y="280" width="60" height="80" rx="2"/> <rect x="200" y="280" width="60" height="80" rx="2"/>
    <rect x="40" y="400" width="60" height="80" rx="2"/> <rect x="120" y="400" width="60" height="80" rx="2"/> <rect x="200" y="400" width="60" height="80" rx="2"/>
    <rect x="880" y="140" width="50" height="70" rx="2"/> <rect x="950" y="140" width="50" height="70" rx="2"/> <rect x="1020" y="140" width="50" height="70" rx="2"/>
    <rect x="880" y="240" width="50" height="70" rx="2"/> <rect x="950" y="240" width="50" height="70" rx="2"/> <rect x="1020" y="240" width="50" height="70" rx="2"/>
    <rect x="1580" y="160" width="55" height="75" rx="2"/> <rect x="1660" y="160" width="55" height="75" rx="2"/> <rect x="1740" y="160" width="55" height="75" rx="2"/>
    <rect x="1580" y="280" width="55" height="75" rx="2"/> <rect x="1660" y="280" width="55" height="75" rx="2"/> <rect x="1740" y="280" width="55" height="75" rx="2"/>
  </g>
  <!-- A few lit windows - yellow/amber glow -->
