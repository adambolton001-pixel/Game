  <rect x="200" y="330" width="25" height="50" fill="#1a1818" opacity="0.5"/>
  <rect x="310" y="325" width="35" height="35" fill="#1c1818" opacity="0.6"/>
  <rect x="960" y="285" width="30" height="45" fill="#181420" opacity="0.5"/>
  <rect x="1050" y="295" width="28" height="40" fill="#1a1818" opacity="0.6"/>

