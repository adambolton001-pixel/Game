  <rect x="950" y="240" width="50" height="70" fill="#584008" opacity="0.5" rx="2"/>
  <rect x="1660" y="160" width="55" height="75" fill="#604010" opacity="0.55" rx="2"/>

  <!-- Laundry lines strung between buildings -->
