<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="chandelier" cx="50%" cy="12%" r="35%">
      <stop offset="0%" stop-color="#d4a832" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#a07820" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0804" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1810"/>
      <stop offset="100%" stop-color="#16120c"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1608"/>
      <stop offset="100%" stop-color="#100c04"/>
    </linearGradient>
  </defs>

  <!-- Ceiling - ornate -->
  <rect width="1920" height="160" fill="#1a1408"/>
  <!-- Ceiling rose / plasterwork -->
  <circle cx="960" cy="80" r="120" fill="none" stroke="#2a2010" stroke-width="3"/>
  <circle cx="960" cy="80" r="80" fill="none" stroke="#2a2010" stroke-width="2"/>
  <circle cx="960" cy="80" r="40" fill="#221c0c"/>
  <!-- Chandelier drop -->
  <rect x="953" y="80" width="14" height="120" fill="#1a1408"/>
  <!-- Chandelier frame -->
  <ellipse cx="960" cy="220" rx="100" ry="20" fill="#221c08"/>
  <ellipse cx="960" cy="220" rx="80" ry="15" fill="#2a2410" stroke="#382e14" stroke-width="1"/>
  <!-- Chandelier arms -->
  <line x1="960" y1="220" x2="880" y2="250" stroke="#1e1808" stroke-width="4"/>
  <line x1="960" y1="220" x2="1040" y2="250" stroke="#1e1808" stroke-width="4"/>
  <line x1="960" y1="220" x2="900" y2="260" stroke="#1e1808" stroke-width="3"/>
  <line x1="960" y1="220" x2="1020" y2="260" stroke="#1e1808" stroke-width="3"/>
  <!-- Candle flames -->
  <ellipse cx="878" cy="256" rx="6" ry="8" fill="#e8c040" opacity="0.8"/>
  <ellipse cx="1042" cy="256" rx="6" ry="8" fill="#e8c040" opacity="0.8"/>
  <ellipse cx="898" cy="267" rx="5" ry="7" fill="#e0b838" opacity="0.75"/>
  <ellipse cx="1022" cy="267" rx="5" ry="7" fill="#e0b838" opacity="0.75"/>
  <ellipse cx="960" cy="240" rx="5" ry="7" fill="#e8c040" opacity="0.8"/>

  <!-- Walls -->
  <rect y="160" width="1920" height="660" fill="url(#wallGrad)"/>
  <!-- Wainscoting panels -->
  <rect y="640" width="1920" height="180" fill="#1a1408"/>
  <rect y="636" width="1920" height="8" fill="#2a2010"/>
  <rect y="812" width="1920" height="8" fill="#2a2010"/>
  <!-- Panel lines -->
  <g fill="none" stroke="#221a08" stroke-width="2">
    <rect x="60" y="656" width="200" height="148"/> <rect x="280" y="656" width="200" height="148"/> <rect x="500" y="656" width="200" height="148"/>
    <rect x="720" y="656" width="200" height="148"/> <rect x="940" y="656" width="200" height="148"/> <rect x="1160" y="656" width="200" height="148"/>
    <rect x="1380" y="656" width="200" height="148"/> <rect x="1600" y="656" width="200" height="148"/>
    <rect x="76" y="666" width="168" height="128"/> <rect x="296" y="666" width="168" height="128"/> <rect x="516" y="666" width="168" height="128"/>
    <rect x="736" y="666" width="168" height="128"/> <rect x="956" y="666" width="168" height="128"/> <rect x="1176" y="666" width="168" height="128"/>
    <rect x="1396" y="666" width="168" height="128"/> <rect x="1616" y="666" width="168" height="128"/>
  </g>

  <!-- Portrait painting - left wall -->
  <rect x="80" y="220" width="220" height="320" fill="#100e08"/>
  <rect x="70" y="210" width="240" height="340" fill="none" stroke="#3a2c10" stroke-width="12"/>
  <!-- Silhouette in portrait -->
  <ellipse cx="190" cy="320" rx="55" ry="65" fill="#1a1408"/>
  <rect x="130" y="370" width="120" height="160" fill="#181208"/>
  <!-- Portrait light effect -->
  <rect x="80" y="220" width="220" height="320" fill="#c8a040" opacity="0.04"/>

  <!-- Grand fireplace - centre -->
  <rect x="760" y="240" width="400" height="400" fill="#120e08"/>
  <rect x="780" y="260" width="360" height="360" fill="#1a1408"/>
  <!-- Mantel surround -->
  <rect x="740" y="220" width="440" height="30" fill="#2a2010"/>
  <rect x="730" y="200" width="460" height="26" fill="#3a2e14"/>
  <rect x="720" y="180" width="480" height="26" fill="#2a2010"/>
  <!-- Firebox -->
  <rect x="820" y="420" width="280" height="200" fill="#0a0604" rx="3"/>
  <!-- Fire -->
  <ellipse cx="960" cy="580" rx="100" ry="60" fill="#c04010" opacity="0.7"/>
  <ellipse cx="960" cy="565" rx="75" ry="45" fill="#d86020" opacity="0.65"/>
  <ellipse cx="960" cy="548" rx="55" ry="35" fill="#e88030" opacity="0.6"/>
  <ellipse cx="960" cy="535" rx="35" ry="25" fill="#f0a840" opacity="0.55"/>
  <ellipse cx="960" cy="525" rx="20" ry="18" fill="#f8d060" opacity="0.5"/>
  <!-- Mantel items -->
  <rect x="760" y="170" width="50" height="30" fill="#2a2010" rx="3"/>
  <rect x="1110" y="170" width="50" height="30" fill="#2a2010" rx="3"/>
  <rect x="920" y="150" width="80" height="50" fill="#221808" rx="4"/>
  <!-- Clock on mantel -->
  <rect x="930" y="155" width="60" height="44" fill="#1e1608" rx="5"/>
  <circle cx="960" cy="178" r="16" fill="#120e06" stroke="#2a2010" stroke-width="1.5"/>

  <!-- Mahogany desk - right of centre -->
  <rect x="1200" y="580" width="500" height="240" fill="#200e06" rx="4"/>
  <rect x="1200" y="565" width="500" height="22" fill="#2e1608" rx="3"/>
  <rect x="1210" y="585" width="10" height="230" fill="#180a04"/>
  <rect x="1680" y="585" width="10" height="230" fill="#180a04"/>
  <!-- Leather inlay on desk top -->
  <rect x="1220" y="570" width="460" height="10" fill="#1a2010" opacity="0.6"/>
  <!-- Papers / documents -->
  <rect x="1230" y="570" width="140" height="180" fill="#ddd5c0" opacity="0.75" transform="rotate(-4 1230 570)"/>
  <rect x="1400" y="570" width="120" height="160" fill="#d5cdb8" opacity="0.6" transform="rotate(2 1400 570)"/>
  <!-- Ink well -->
  <circle cx="1640" cy="568" r="18" fill="#0a0806"/>
  <ellipse cx="1640" cy="565" rx="12" ry="8" fill="#08080c"/>
  <!-- Letter opener -->
  <rect x="1560" y="572" width="100" height="5" fill="#503820" rx="2" transform="rotate(-10 1560 572)"/>
  <!-- Leather chair -->
  <rect x="1320" y="750" width="220" height="120" fill="#1a0c06" rx="8"/>
  <rect x="1300" y="700" width="260" height="70" fill="#220e08" rx="6"/>
  <rect x="1300" y="700" width="30" height="180" fill="#220e08" rx="4"/>
  <rect x="1530" y="700" width="30" height="180" fill="#220e08" rx="4"/>

  <!-- Side table with decanter -->
  <rect x="1750" y="640" width="120" height="180" fill="#1c1008" rx="3"/>
  <rect x="1755" y="632" width="110" height="12" fill="#281408"/>
  <!-- Decanter -->
  <rect x="1790" y="580" width="40" height="55" fill="#1a1430" opacity="0.8" rx="3"/>
  <rect x="1800" y="575" width="20" height="12" fill="#201838" rx="2"/>
  <!-- Glasses -->
  <rect x="1760" y="610" width="18" height="28" fill="#181430" opacity="0.7" rx="2"/>
  <rect x="1840" y="610" width="18" height="28" fill="#181430" opacity="0.7" rx="2"/>

  <!-- Floor - black and white Victorian tile -->
  <rect y="820" width="1920" height="260" fill="url(#floorGrad)"/>
  <g fill="#0e0a06" opacity="0.4">
    <rect x="0" y="820" width="80" height="80"/>    <rect x="160" y="820" width="80" height="80"/>  <rect x="320" y="820" width="80" height="80"/>  <rect x="480" y="820" width="80" height="80"/>
    <rect x="640" y="820" width="80" height="80"/>  <rect x="800" y="820" width="80" height="80"/>  <rect x="960" y="820" width="80" height="80"/>  <rect x="1120" y="820" width="80" height="80"/>
    <rect x="1280" y="820" width="80" height="80"/> <rect x="1440" y="820" width="80" height="80"/> <rect x="1600" y="820" width="80" height="80"/> <rect x="1760" y="820" width="80" height="80"/>
    <rect x="80" y="900" width="80" height="80"/>   <rect x="240" y="900" width="80" height="80"/>  <rect x="400" y="900" width="80" height="80"/>  <rect x="560" y="900" width="80" height="80"/>
    <rect x="720" y="900" width="80" height="80"/>  <rect x="880" y="900" width="80" height="80"/>  <rect x="1040" y="900" width="80" height="80"/> <rect x="1200" y="900" width="80" height="80"/>
    <rect x="1360" y="900" width="80" height="80"/> <rect x="1520" y="900" width="80" height="80"/> <rect x="1680" y="900" width="80" height="80"/> <rect x="1840" y="900" width="80" height="80"/>
    <rect x="0" y="980" width="80" height="80"/>    <rect x="160" y="980" width="80" height="80"/>  <rect x="320" y="980" width="80" height="80"/>  <rect x="480" y="980" width="80" height="80"/>
    <rect x="640" y="980" width="80" height="80"/>  <rect x="800" y="980" width="80" height="80"/>  <rect x="960" y="980" width="80" height="80"/>  <rect x="1120" y="980" width="80" height="80"/>
    <rect x="1280" y="980" width="80" height="80"/> <rect x="1440" y="980" width="80" height="80"/> <rect x="1600" y="980" width="80" height="80"/> <rect x="1760" y="980" width="80" height="80"/>
  </g>
  <rect y="816" width="1920" height="8" fill="#2a2010"/>

  <!-- Chandelier glow -->
  <rect width="1920" height="1080" fill="url(#chandelier)"/>

  <!-- Foreground shadow -->
  <rect y="1010" width="1920" height="70" fill="#060402" opacity="0.9"/>
</svg>
