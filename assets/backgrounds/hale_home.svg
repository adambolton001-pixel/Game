<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="firelight" cx="18%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#c45a0a" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#7a3005" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0a02" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
